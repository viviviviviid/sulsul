name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -WithoutAntigravity -SkipRegister
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: runner.os == 'Windows'
        run: npm run package
