name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 25
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -WithoutAntigravity -SkipRegister
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - if: runner.os == 'Windows'
        run: npm run package
      - if: runner.os == 'Windows'
        run: npm run package:source
      - if: runner.os == 'Windows'
        run: npm run package:extension
      - if: runner.os == 'macOS'
        run: npm run package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Attach files to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --verify-tag --draft --generate-notes
